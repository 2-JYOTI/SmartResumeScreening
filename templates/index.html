<!DOCTYPE html>
<html>
<head>
    <title>Smart Resume Screening</title>
</head>
<body>

<h1>Smart Resume Screening System</h1>

<form action="/match" method="POST" enctype="multipart/form-data">

    <p>Upload Resume (PDF)</p>
    <input type="file" name="resume" required>

    <br><br>

    <p>Job Description</p>

    <textarea
        name="job_description"
        rows="10"
        cols="60"
        required></textarea>

    <br><br>

    <button type="submit">
        Calculate Match
    </button>

</form>

</body>
</html>
